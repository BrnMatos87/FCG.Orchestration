apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-payments-api
  namespace: fcg
  labels:
    app: fcg-payments-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: fcg-payments-api

  template:
    metadata:
      labels:
        app: fcg-payments-api

    spec:
      initContainers:
        - name: wait-for-infrastructure
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z payments-sqlserver 1433; do
                echo "Aguardando SQL Server do Payments..."
                sleep 5
              done

              until nc -z rabbitmq 5672; do
                echo "Aguardando RabbitMQ..."
                sleep 5
              done

      containers:
        - name: fcg-payments-api
          image: brnmatos/fcg-payments-api:1.0.2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: fcg-payments-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: Payments__ConnectionString
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: Jwt__SecretKey
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: RabbitMq__Username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: RabbitMq__Password
            - name: Notifications__FunctionKey
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: Notifications__FunctionKey

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
