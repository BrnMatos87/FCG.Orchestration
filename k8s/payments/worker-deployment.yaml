apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-payments-worker
  namespace: fcg
  labels:
    app: fcg-payments-worker
spec:
  replicas: 1

  selector:
    matchLabels:
      app: fcg-payments-worker

  template:
    metadata:
      labels:
        app: fcg-payments-worker

    spec:
      initContainers:
        - name: wait-for-infrastructure
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z payments-sqlserver 1433; do
                echo "Aguardando SQL Server do Payments..."
                sleep 5
              done

              until nc -z rabbitmq 5672; do
                echo "Aguardando RabbitMQ..."
                sleep 5
              done

      containers:
        - name: fcg-payments-worker
          image: brnmatos/fcg-payments-worker:1.0.2
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: fcg-payments-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: Payments__ConnectionString
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: RabbitMq__Username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: RabbitMq__Password
            - name: Notifications__FunctionKey
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: Notifications__FunctionKey

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
