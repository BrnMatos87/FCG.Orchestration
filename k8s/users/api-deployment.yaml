apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-users-api
  namespace: fcg
  labels:
    app: fcg-users-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: fcg-users-api

  template:
    metadata:
      labels:
        app: fcg-users-api

    spec:
      initContainers:
        - name: wait-for-sqlserver
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z users-sqlserver 1433; do echo "Aguardando SQL Server..."; sleep 5; done
      containers:
        - name: fcg-users-api
          image: acrfcgfase41htwn9.azurecr.io/fcg-users-api:1.0.5

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: fcg-users-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: Users__ConnectionString
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: Jwt__SecretKey
            - name: AdminSeed__Email
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: AdminSeed__Email
            - name: AdminSeed__Password
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: AdminSeed__Password
            - name: Notifications__FunctionKey
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: Notifications__FunctionKey

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
