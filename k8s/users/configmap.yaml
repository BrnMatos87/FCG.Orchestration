apiVersion: v1
kind: ConfigMap
metadata:
  name: fcg-users-config
  namespace: fcg
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"

  Jwt__Issuer: "FCG.Users.Api"
  Jwt__Audience: "FCG.CloudGames"
  Jwt__ExpirationMinutes: "180"

  Notifications__BaseUrl: "https://fcg-notifications-dev-001.azurewebsites.net"
