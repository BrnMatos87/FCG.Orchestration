apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-catalog-worker
  namespace: fcg
  labels:
    app: fcg-catalog-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fcg-catalog-worker
  template:
    metadata:
      labels:
        app: fcg-catalog-worker
    spec:
      initContainers:
        - name: wait-for-infrastructure
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z catalog-sqlserver 1433; do
                echo "Aguardando SQL Server..."
                sleep 5
              done
              until nc -z rabbitmq 5672; do
                echo "Aguardando RabbitMQ..."
                sleep 5
              done
        - name: wait-for-rabbitmq-authentication
          image: curlimages/curl:8.12.1
          command:
            - sh
            - -c
            - |
              until curl --silent --fail \
                --user "$RABBITMQ_USERNAME:$RABBITMQ_PASSWORD" \
                http://rabbitmq:15672/api/overview \
                > /dev/null; do
                echo "Aguardando RabbitMQ aceitar clientes autenticados..."
                sleep 5
              done
          env:
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: RabbitMq__Username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: RabbitMq__Password
      containers:
        - name: fcg-catalog-worker
          image: brnmatos/fcg-catalog-worker:1.0.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fcg-catalog-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: Catalog__ConnectionString
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: RabbitMq__Username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: fcg-shared-secret
                  key: RabbitMq__Password
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
